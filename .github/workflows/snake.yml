name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300F7F7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300F7F7

      - name: Push snake to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: dist
          publish_branch: output
          github_token: ${{ secrets.GITHUB_TOKEN }}
